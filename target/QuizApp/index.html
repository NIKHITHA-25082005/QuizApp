<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Quiz App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .bubbles { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; }
        .bubble { position: absolute; bottom: -100px; background: rgba(255,255,255,0.05); border-radius: 50%; animation: rise 10s infinite ease-in; }
        .bubble:nth-child(1) { left: 10%; width: 20px; height: 20px; animation-duration: 8s; }
        .bubble:nth-child(2) { left: 20%; width: 50px; height: 50px; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 35%; width: 30px; height: 30px; animation-duration: 9s; animation-delay: 1s; }
        .bubble:nth-child(4) { left: 50%; width: 60px; height: 60px; animation-duration: 11s; animation-delay: 3s; }
        .bubble:nth-child(5) { left: 65%; width: 25px; height: 25px; animation-duration: 7s; animation-delay: 1.5s; }
        .bubble:nth-child(6) { left: 80%; width: 45px; height: 45px; animation-duration: 13s; animation-delay: 4s; }
        @keyframes rise {
            0% { bottom: -100px; transform: translateX(0); opacity: 0.5; }
            50% { transform: translateX(50px); opacity: 0.3; }
            100% { bottom: 110%; transform: translateX(-50px); opacity: 0; }
        }
        .container {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 60px 50px;
            text-align: center;
            max-width: 500px; width: 90%;
            animation: fadeInUp 1s ease forwards;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emoji { font-size: 70px; display: block; animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 { color: #fff; font-size: 2.2rem; margin: 20px 0 10px; animation: glow 2s infinite alternate; }
        @keyframes glow {
            from { text-shadow: 0 0 10px #a78bfa; }
            to { text-shadow: 0 0 25px #818cf8, 0 0 40px #6366f1; }
        }
        p { color: rgba(255,255,255,0.7); font-size: 1rem; margin-bottom: 10px; }
        .input-group { margin: 15px 0; text-align: left; }
        .input-group label { color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 6px; display: block; }
        .input-group input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus { border-color: #a78bfa; box-shadow: 0 0 10px rgba(167,139,250,0.3); }
        .input-group input::placeholder { color: rgba(255,255,255,0.3); }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            color: white; padding: 6px 20px;
            border-radius: 20px; font-size: 0.9rem;
            margin: 15px 0; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .start-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            color: white; border: none;
            padding: 15px 50px; font-size: 1.1rem;
            border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(99,102,241,0.4);
            letter-spacing: 1px; margin-top: 10px;
        }
        .start-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 40px rgba(99,102,241,0.6); }
    </style>
</head>
<body>
    <div class="bubbles">
        <div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div>
    </div>
    <div class="container">
        <span class="emoji">🧠</span>
        <h1>NLP Quiz App</h1>
        <p>Test your Natural Language Processing knowledge!</p>
        <div class="badge">50 Questions</div>
        <form action="quiz" method="get">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" name="studentName" placeholder="Enter your name" required>
            </div>
            <div class="input-group">
                <label>Roll Number</label>
                <input type="text" name="rollNumber" placeholder="Enter your roll number" required>
            </div>
            <input type="hidden" name="qno" value="1">
            <button type="submit" class="start-btn">🚀 Start Quiz</button>
        </form>
    </div>
</body>
</html>
